<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Labels - Luna's Pharmacy</title>
    <link rel="stylesheet" href="assets/css/inventory.css">
</head>
<body data-page="labels">

    <header class="inv-header">
        <img class="inv-logo" src="assets/images/logo.png" alt="Luna's Pharmacy Logo" />
        <div class="inv-title">
            <h1>Barcode Labels</h1>
            <span id="role-label">Cashier</span>
        </div>
        <nav class="inv-nav">
            <a href="pos.html" class="inv-link">Point of Sale</a>
            <a href="staff.html" class="inv-link">Workspace</a>
            <a href="inventory.html" class="inv-link">Inventory</a>
            <a href="inventory-edit.html" class="inv-link inv-admin-link" style="display:none;">Update Inventory</a>
            <a href="labels.html" class="inv-link active">Labels</a>
            <a href="reports.html" class="inv-link">Reports</a>
            <a href="users.html" class="inv-link inv-admin-link" style="display:none;">Accounts</a>
            <a href="home.html" class="inv-link">Back to Store</a>
            <button type="button" class="inv-logout">Log Out</button>
        </nav>
    </header>

    <main class="inv-main">
        <div class="inv-page-head">
            <div>
                <h2>Printable Barcode Labels</h2>
                <p>Print this sheet and cut out the stickers for your shelves or medicine boxes.</p>
            </div>
            <div class="inv-stats">
                <div class="stat-card">
                    <div class="label">Labels</div>
                    <div class="value" id="label-count">0</div>
                </div>
            </div>
        </div>

        <div class="inv-toolbar">
            <input type="text" id="label-search" class="inv-search" placeholder="Search name or barcode..." aria-label="Search labels" />
            <button type="button" id="label-print-btn" class="btn btn-primary">Print Labels</button>
            <span class="hint" id="label-hint"></span>
        </div>

        <div id="label-grid" class="label-grid"></div>
        <p id="label-empty" class="no-results" style="display:none;">No medicines match your search.</p>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/barcode.js"></script>
    <script src="assets/js/labels.js"></script>
</body>
</html>
