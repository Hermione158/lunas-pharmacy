<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Luna's Pharmacy</title>
    <link rel="stylesheet" href="assets/css/inventory.css">
</head>
<body data-page="users">

    <header class="inv-header">
        <img class="inv-logo" src="assets/images/logo.png" alt="Luna's Pharmacy Logo" />
        <div class="inv-title">
            <h1>Accounts</h1>
            <span id="role-label">Administrator</span>
        </div>
        <nav class="inv-nav">
            <a href="pos.html" class="inv-link">Point of Sale</a>
            <a href="inventory.html" class="inv-link">Inventory</a>
            <a href="reports.html" class="inv-link">Reports</a>
            <a href="users.html" class="inv-link active">Accounts</a>
            <a href="home.html" class="inv-link">Back to Store</a>
            <button type="button" class="inv-logout">Log Out</button>
        </nav>
    </header>

    <main class="inv-main">
        <div class="inv-page-head">
            <div>
                <h2>Staff Accounts</h2>
                <p>Create cashier and administrator logins. Passwords are stored as secure hashes.</p>
            </div>
            <div class="inv-stats">
                <div class="stat-card">
                    <div class="label">Total Accounts</div>
                    <div class="value" id="total-users">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Administrators</div>
                    <div class="value" id="admin-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Cashiers</div>
                    <div class="value" id="cashier-count">0</div>
                </div>
            </div>
        </div>

        <div class="inv-toolbar">
            <input type="text" id="new-username" class="inv-search" placeholder="Username" aria-label="New username" />
            <input type="password" id="new-password" class="inv-search" placeholder="Password (6+ characters)" aria-label="New password" />
            <select id="new-role" class="inv-input narrow" aria-label="Role">
                <option value="cashier">Cashier</option>
                <option value="admin">Administrator</option>
            </select>
            <button type="button" id="add-user" class="btn btn-primary">Add Account</button>
            <span class="hint" id="user-hint"></span>
        </div>

        <div class="inv-table-wrap">
            <table class="inv-table" id="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/users.js"></script>
</body>
</html>
